// Same shape as `create-expo-module --local` for SDK 54 (expo-module-template-local@0.7.10).
// `expo-module-gradle-plugin` applies kotlin-android, adds `compileOnly project(':expo-modules-core')`
// (which provides `expo.modules.kotlin.*`), and inherits the host app's compile/min/target SDK.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.agentkeepalive'
version = '0.1.0'

android {
  namespace "expo.modules.agentkeepalive"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat / ContextCompat live in androidx.core; the host app already
  // resolves a recent version and Gradle keeps the highest, so this floor never
  // downgrades the app.
  implementation "androidx.core:core-ktx:1.13.1"
}
